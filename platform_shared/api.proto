syntax = "proto3";

package api;

// Empty message for endpoints which only needs a status
message EmptyMessage {}

// =============================================================================
// AP (Access Point) Settings - shared data types
// =============================================================================

enum APProvisionMode {
    AP_MODE_ALWAYS = 0;
    AP_MODE_DISCONNECTED = 1;
    AP_MODE_NEVER = 2;
}

enum APNetworkStatus {
    AP_ACTIVE = 0;
    AP_INACTIVE = 1;
    AP_LINGERING = 2;
}

message APSettings {
    APProvisionMode provision_mode = 1;
    string ssid = 2;
    string password = 3;
    uint32 channel = 4;
    bool ssid_hidden = 5;
    uint32 max_clients = 6;
    uint32 local_ip = 7;
    uint32 gateway_ip = 8;
    uint32 subnet_mask = 9;
}

message APStatus {
    APNetworkStatus status = 1;
    uint32 ip_address = 2;
    string mac_address = 3;
    uint32 station_num = 4;
}

// =============================================================================
// Servo Settings - shared data types
// =============================================================================

message Servo {
    float center_pwm = 1;
    float direction = 2;
    float center_angle = 3;
    float conversion = 4;
    string name = 5;
}

message ServoSettings {
    repeated Servo servos = 1; // max 18 servos
}

// =============================================================================
// WiFi STA Settings - shared data types
// =============================================================================

message WifiNetwork {
    string ssid = 1;
    string password = 2;
    bool static_ip_config = 3;
    uint32 local_ip = 4;
    uint32 gateway_ip = 5;
    uint32 subnet_mask = 6;
    uint32 dns_ip_1 = 7;
    uint32 dns_ip_2 = 8;
}

message WifiSettings {
    string hostname = 1;
    bool priority_rssi = 2;
    repeated WifiNetwork wifi_networks = 3; // max 5 networks
    uint32 selected_network = 4;
    // Fingerprint of the secrets.h network last merged in (settings/factory_network.h); the firmware
    // keeps it across app updates and does not send it out.
    uint32 applied_secret = 5;
}

message WifiNetworksRequest {}

// WiFi scan result - single network found during scan
message WifiNetworkScan {
    int32 rssi = 1;
    string ssid = 2;
    string bssid = 3;
    uint32 channel = 4;
    uint32 encryption_type = 5;
}

// Response for /api/wifi/networks endpoint
message WifiNetworkList {
    repeated WifiNetworkScan networks = 1;
}

// Response for /api/wifi/sta/status endpoint
message WifiStatus {
    uint32 status = 1;
    uint32 local_ip = 2;
    string mac_address = 3;
    int32 rssi = 4;
    string ssid = 5;
    string bssid = 6;
    uint32 channel = 7;
    uint32 subnet_mask = 8;
    uint32 gateway_ip = 9;
    uint32 dns_ip_1 = 10;
    uint32 dns_ip_2 = 11;
}

// =============================================================================
// mDNS Settings - shared data types
// =============================================================================

message MDNSTxtRecord {
    string key = 1;
    string value = 2;
}

message MDNSServiceDef {
    string service = 1;
    string protocol = 2;
    uint32 port = 3;
    repeated MDNSTxtRecord txt_records = 4;
}

message MDNSSettings {
    string hostname = 1;
    string instance = 2;
    repeated MDNSServiceDef services = 3;
    repeated MDNSTxtRecord global_txt_records = 4;
}

message MDNSQueryRequest {
    string service = 1;
    string protocol = 2;
}

message MDNSQueryResult {
    string name = 1;
    string ip = 2;
    uint32 port = 3;
}

message MDNSQueryResponse {
    repeated MDNSQueryResult services = 1;
}

// =============================================================================
// Peripheral Settings - I2C configuration
// =============================================================================

message PinConfig {
    int32 pin = 1;
    string mode = 2;
    string type = 3;
    string role = 4;
}

message PeripheralSettings {
    int32 sda = 1;
    int32 scl = 2;
    int32 frequency = 3;
    repeated PinConfig pins = 4;
    // Hard-iron offset of the compass in uT, in the chip frame: subtracted from every reading before the
    // heading is taken. Fitted by simulation/calibrate_compass.py; zero means uncalibrated.
    float mag_offset_x = 5;
    float mag_offset_y = 6;
    float mag_offset_z = 7;
}

// =============================================================================
// File System - shared data types
// =============================================================================

message FileDeleteRequest {
    string path = 1;
}

// Chunked transfer over the correlation channel, for transports without HTTP. Offset 0 truncates;
// the chunk whose end equals total_size completes the file. At most 512 bytes per chunk.
message FileWriteChunk {
    string path = 1;
    uint32 offset = 2;
    uint32 total_size = 3;
    bytes content = 4;
}
message FileReadChunk {
    string path = 1;
    uint32 offset = 2;
    uint32 length = 3;  // at most 512
}
message FileChunk {
    bytes content = 1;
    uint32 total_size = 2;
}
