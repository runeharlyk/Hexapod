syntax = "proto3";

package socket_message;

// api.proto settings types are reused so a setting can be read/written over any transport.
import "api.proto";
import "animation.proto";

message Vector {
  float x = 1;
  float y = 2;
}

message PingMsg {}
message PongMsg {}
message SubscribeNotification { int32 tag = 1; }
message UnsubscribeNotification { int32 tag = 1; }

// Mirrors firmware MOTION_STATE. Serialized by enum value. 2 was POSE, every servo at its centre pulse, which the
// calibration page's ServoCentreRequest does from IDLE now; a deployed app may still send it, so it stays unused.
enum ModesEnum {
  reserved 2;
  reserved "POSE";
  DEACTIVATED = 0;
  IDLE = 1;
  STAND = 3;
  WALK = 4;
  WALK_NN = 5;
  ANIMATE = 6;  // plays animation files; see animation.proto
}

// Mirrors firmware GaitType.
enum GaitEnum {
  TRI_GATE = 0;
  BI_GATE = 1;
  WAVE = 2;
  RIPPLE = 3;
  TUNED = 4;
  AUTO = 5;
}

message ControllerInputData {
  Vector left = 1;
  Vector right = 2;
  float height = 3;
  float speed = 4;
  float s1 = 5;
  float feet_distance = 6;
  float stride = 7;  // -1 the shortest stroke, 0 (unsent) each gait's speed-optimal one, 1 the longest
}

// Pushed as the robot applies a mode, and as the ESP-NOW handheld starts or stops driving: while it drives, the other
// sources' sticks are dropped and a goal is refused (423). Sent, it sets the mode alone.
message ModeData {
  ModesEnum mode = 1;
  bool handheld = 2;
}
message GaitData { GaitEnum gait = 1; }
message AnglesData { repeated int32 angles = 1; } // 18 servos
message IMUData {
  float x = 1;
  float y = 2;
  float z = 3;
  float heading = 4;
}

message ServoPWMData {
  int32 servo_id = 1;
  uint32 servo_pwm = 2;
}
message ServoStateData { bool active = 1; }
// One joint's angle in degrees, as the robot reports its angles (AnglesData): taken in IDLE only and ignored in every
// other mode, held within the joint's travel and written to that servo alone. Sent as a drag of the 3D model moves.
message JointAngleData {
  uint32 servo = 1;  // 0-17, three per leg (coxa, femur, tibia) in leg order
  float degrees = 2;
}
// Every servo to its calibrated centre pulse, so the calibration page can line the joints up with their marks.
// Answered with an empty response: 200 done at the next tick, 409 the robot is not idle.
message ServoCentreRequest {}

// --- Correlation RPC (request/response over the websocket) ---

// The app names the part from the address; the robot never filled these.
message I2CDevice {
  int32 address = 1;
  reserved 2, 3;
  reserved "part_number", "name";
}
message I2CScanData { repeated I2CDevice devices = 1; }
message I2CScanDataRequest {}

message AnalyticsData {
  int32 max_alloc_heap = 1;
  int32 psram_size = 2;
  int32 free_psram = 3;
  int32 free_heap = 4;
  int32 total_heap = 5;
  int32 min_free_heap = 6;
  float core_temp = 7;
  int32 fs_total = 8;
  int32 fs_used = 9;
  int64 uptime = 10;
  float cpu0_usage = 11;
  float cpu1_usage = 12;
  float cpu_usage = 13;
  repeated I2CDeviceErrors i2c_errors = 14;
  uint32 i2c_bus_recoveries = 15;  // times a device holding SDA low was clocked free
}

// One I2C device's failed transfers since boot.
message I2CDeviceErrors {
  uint32 address = 1;
  uint32 nacks = 2;     // failed on a free bus within the timeout: the device did not acknowledge
  uint32 timeouts = 3;  // left a line held low, or spent the transfer's whole timeout
}

message StaticSystemInformation {
  string esp_platform = 1;
  string firmware_version = 2;
  uint32 cpu_freq_mhz = 3;
  string cpu_type = 4;
  uint32 cpu_cores = 6;
  string sdk_version = 9;
  uint32 flash_chip_size = 11;
  string cpu_reset_reason = 13;
}

message SystemInformationRequest {}
message SystemInformationResponse {
  AnalyticsData analytics_data = 1;
  StaticSystemInformation static_system_information = 2;
}

// The FreeRTOS task table, a measurement read by request (the metrics page asks when it opens and on its refresh).
message TaskStatsRequest {}
// eTaskState's positions. A snapshot sees only its own core's task as running, which is the transport task answering
// the request, so the other core's running task shows as ready.
enum TaskState {
  TASK_RUNNING = 0;
  TASK_READY = 1;
  TASK_BLOCKED = 2;
  TASK_SUSPENDED = 3;  // also a task waiting for a notification without a timeout
  TASK_DELETED = 4;    // ended, its memory not yet freed by the idle task
}
message TaskEntry {
  string name = 1;
  uint32 number = 2;          // FreeRTOS's task number, unique since boot; the EventBus workers share one name
  TaskState state = 3;
  uint32 priority = 4;        // current, raised by priority inheritance while the task holds a mutex
  uint32 base_priority = 5;
  sint32 core = 6;            // the core the task is pinned to, -1 for either
  uint32 stack_free_min = 7;  // bytes: the least free stack since the task started
  float cpu_percent = 8;      // of one core over the window; 0 when window_us is 0
}
// A request within 10 s of the last snapshot gets that reply again: a snapshot masks interrupts on both cores.
message TaskStats {
  uint32 window_us = 1;       // since the robot's previous snapshot, from any client; 0 on the first, which has no CPU
  uint32 snapshot_us = 2;     // from the call to the snapshot's end, about how long it held the kernel's lock
  uint32 task_count = 3;      // tasks on the robot; more than tasks lists when the roomiest stacks were cut
  repeated TaskEntry tasks = 4;  // the least free stack first
}

message FeaturesDataRequest {}
message FeaturesDataResponse {
  string firmware_name = 1;
  string firmware_version = 2;
  bool camera = 3;
  bool imu = 4;
  bool mag = 5;
  bool servo = 6;
  bool mdns = 7;
  // SHA-256 of the running firmware's ELF, from its app descriptor, as 64 hex digits. An update
  // that rolled back reports the previous image's hash, which is how the app tells the two apart.
  string firmware_elf_sha256 = 8;
}

// Calibrates the MPU6050 on a robot lying still and level: the gyro bias goes to zero and the
// accelerometer to straight down. Answered with an empty response: 200 calibrated, 409 the robot is
// not resting (deactivated or idle), 422 it moved or lies tilted, 503 there is no IMU, 500 the
// calibration could not start, 504 it did not finish within 10 s.
message ImuCalibrateRequest {}

// The offsets the calibration wrote into the chip, persisted and applied at boot.
message ImuCalibration {
  repeated sint32 accel_offsets = 1;
  repeated sint32 gyro_offsets = 2;
}

// A firmware update over the protobuf link, for clients that cannot reach POST /api/firmware (an
// https page on Bluetooth or USB). The image goes in order, in chunks of at most 512 bytes, into the
// app slot the robot does not run from; the finish validates it, selects it and restarts the robot.
// Refusals carry their reason in CorrelationResponse.error_message.
message OtaStart {
  uint32 size = 1;
}
message OtaChunk {
  uint32 index = 1;
  bytes data = 2;
}
message OtaFinish {}

// What a tick's write to one PCA9685 board did.
enum ServoWrite {
  SERVO_WRITE_NONE = 0;       // nothing was written: no servo driven, no WALK_NN angles, or calibration holds the pulses
  SERVO_WRITE_OK = 1;
  SERVO_WRITE_FAILED = 2;     // attempted and not acknowledged
  SERVO_WRITE_SKIPPED = 3;    // not attempted: the board is backing off after failed writes
  SERVO_WRITE_RESTARTED = 4;  // it answered after failing without its configuration, so it was started again
}

// One 5 ms control tick, as the robot ran it: for comparing the real control loop, IMU and command
// path with what the simulation assumes (simulation/record.py, report_recording.py).
message TickSample {
  uint32 seq = 1;
  uint64 t_us = 2;               // tick start, esp_timer clock
  uint32 period_us = 3;          // since the previous tick start
  uint32 compute_us = 4;         // tick start to the end of the servo write
  bool imu_fresh = 5;            // a new IMU sample was read on this tick (the IMU is polled at 40 Hz)
  repeated float rpy = 6;        // rad, roll, pitch, yaw from the DMP
  repeated float gyro = 7;       // rad/s, body rates
  repeated float gravity = 8;    // unit vector, DMP convention (world up)
  repeated float angles = 9;     // deg, the 18 joint angles the motion produced this tick
  repeated float command = 10;   // lx, ly, rx, ry, h, s, s1, fd, stride of the last command
  uint32 command_age_ms = 11;    // since that command arrived; 0 before any
  uint32 mode = 12;              // MOTION_STATE position
  uint32 gait = 13;              // GaitType position
  repeated float mag = 14;       // uT, the compass as the chip read it, before the hard-iron offset; the last reading
  bool mag_fresh = 15;           // the compass was polled on this tick; the chip outputs 15 Hz, so a polled reading can repeat

  // The odometry after this tick, in the body frame of docs/conventions.md that the robot faced at the last reset.
  float odom_x = 16;             // m, right
  float odom_y = 17;             // m, forward
  float odom_yaw = 18;           // rad, counter-clockwise, the gyro fused in
  float odom_kinematic_yaw = 19; // rad, as odom_yaw, from the feet alone
  float odom_distance = 20;      // m travelled along the path

  // The servo write of this tick. pwm holds the 18 pulses, in PCA9685 counts of 4096 and in angles' order, that the
  // tick wrote or meant to write (a failed or skipped board's too), and 0 for a board it did not write.
  repeated uint32 pwm = 21;
  uint32 servo_write_us = 22;         // time spent writing both boards; part of compute_us
  ServoWrite servo_write_right = 23;  // board 0x41, servos 0-8
  ServoWrite servo_write_left = 24;   // board 0x40, servos 9-17
  // The dead-man stop is in force: set from the tick it zeroed the command until a command or a goal arrives.
  bool link_lost = 25;
}

message TelemetryBatch {
  uint32 batch_seq = 1;
  uint32 dropped_ticks = 2;      // ticks the ring had no room for, since boot
  repeated TickSample ticks = 3;
}

// Reads the odometry; with reset, zeroes its pose after the read. The gyro bias it learned stays.
message OdometryGet {
  bool reset = 1;
}

// The odometry pose in the body frame of docs/conventions.md that the robot faced at the last reset.
message OdometryData {
  float x = 1;              // m, right
  float y = 2;              // m, forward
  float yaw = 3;            // rad, counter-clockwise, the gyro fused in
  float kinematic_yaw = 4;  // rad, as yaw, from the feet alone
  float distance = 5;       // m travelled along the path
}

// A move the robot walks on its own odometry, from STAND or WALK, in the frame it faced when the move started (the
// body frame of docs/conventions.md). The style is what the sliders set; the posture is clamped as theirs is.
enum GoalKind {
  GOAL_FORWARD = 0;   // distance_m, negative is backwards
  GOAL_SIDEWAYS = 1;  // distance_m, positive is right
  GOAL_TURN = 2;      // angle_rad, counter-clockwise
  GOAL_ARC = 3;       // radius_m > 0 and angle_rad, positive curves left
}
enum GoalState {
  GOAL_IDLE = 0;
  GOAL_SETTLING = 1;   // taking the style's posture and gait, or coming to rest to judge the pose
  GOAL_RUNNING = 2;
  GOAL_REACHED = 3;
  GOAL_CANCELLED = 4;
  GOAL_TIMED_OUT = 5;
  GOAL_REFUSED = 6;
}
// Answered 202 with the accepted goal's status, 400 when malformed, 409 when the robot cannot walk now (deactivated,
// in another mode than STAND or WALK, or updating) and 422 for a style it cannot walk (TUNED, or no speed envelope).
message GoalMove {
  GoalKind kind = 1;
  float distance_m = 2;
  float angle_rad = 3;
  float radius_m = 4;
  float speed = 5;  // share in (0, 1] of the gait's top speed at the posture; AUTO's is BI's
  GaitEnum gait = 6;
  float stride = 7;
  float s1 = 8;
  float h = 9;
  float fd = 10;
}
// Ends the goal in progress, if any.
message GoalCancel {}
// Observable: pushed on every state change and every 5 % of progress.
message GoalStatus {
  uint32 id = 1;  // the goal's number since boot, 0 before the first
  GoalState state = 2;
  GoalKind kind = 3;
  float target = 4;    // m for FORWARD and SIDEWAYS, rad for TURN and ARC
  float progress = 5;  // share of the target covered, 0 to 1
  float x = 6;         // the odometry pose, as OdometryData's
  float y = 7;
  float yaw = 8;
  uint32 passes = 9;   // passes started, the first included
}

// The crash the robot kept: on a panic the IDF writes an ELF core dump to the coredump partition, which survives
// restarts and updates until it is erased or the next crash replaces it (docs/firmware.md, "Decoding a core dump").
// Answered with a CoreDumpReport, from the check of the dump the robot makes at boot and after an erase.
message CoreDumpGet {}
// One chunk of the stored dump, counted from its first byte, answered as a FileReadChunk is: a FileChunk whose
// total_size is the dump's size, 404 when none is stored, 400 for a length over 512. GET /api/coredump serves the
// same bytes over HTTP.
message CoreDumpRead {
  uint32 offset = 1;
  uint32 length = 2;  // at most 512
}
// Erases the stored dump, answered with the CoreDumpReport after it. 409 unless the robot rests (deactivated or
// idle): erasing flash stalls both cores, the control loop's too.
message CoreDumpErase {}

message CoreDumpReport {
  bool stored = 1;                // a dump is stored
  uint32 size = 2;                // its bytes, as CoreDumpRead and GET /api/coredump deliver them
  bool readable = 3;              // an ELF dump whose checksum holds, so the fields below were read from it
  string task = 4;                // the task that crashed
  uint32 pc = 5;
  repeated uint32 backtrace = 6;  // the faulting PC, then the return addresses outward, at most 16 in all
  bool backtrace_corrupted = 7;   // the unwinding stopped at a frame it could not trust
  // The task watchdog's message: the IDF (5.4) keeps no other panic's in the dump, so an abort's or assert's is on the
  // serial log alone, and this is empty.
  string panic_reason = 8;
  // Hex SHA-256 of the crashed firmware's ELF, as many leading digits as its CONFIG_APP_RETRIEVE_LEN_ELF_SHA kept: 64
  // since that is set, 9 before.
  string app_elf_sha256 = 9;
  // app_elf_sha256 begins the running firmware's firmware_elf_sha256, so the running build's ELF decodes the dump.
  bool elf_matches_running = 10;
}

message CorrelationRequest {
  // The current mode, goal status, WiFi status and AP status come as the snapshot a subscribe to their topic is
  // answered with (platform_shared/topics.json).
  reserved 53, 62, 133, 134;
  reserved "wifi_status_get", "ap_status_get", "goal_status_get", "mode_get";
  uint32 correlation_id = 1;
  oneof request {
    FeaturesDataRequest features_data_request = 10;
    I2CScanDataRequest i2c_scan_data_request = 20;
    SystemInformationRequest system_information_request = 40;
    api.WifiSettingsRequest wifi_settings_get = 50;
    api.WifiSettings wifi_settings_update = 51;
    api.WifiNetworksRequest wifi_networks_get = 52;
    api.APSettingsRequest ap_settings_get = 60;
    api.APSettings ap_settings_update = 61;
    api.MDNSStatusRequest mdns_status_get = 70;
    api.MDNSQueryRequest mdns_query = 71;
    api.ServoSettingsRequest servo_settings_get = 80;
    api.ServoSettings servo_settings_update = 81;
    ServoCentreRequest servo_centre = 82;
    api.PeripheralSettingsRequest peripheral_settings_get = 90;
    api.PeripheralSettings peripheral_settings_update = 91;
    ImuCalibrateRequest imu_calibrate = 92;
    OtaStart ota_start = 120;
    OtaChunk ota_chunk = 121;
    OtaFinish ota_finish = 122;
    api.FileWriteChunk file_write_chunk = 100;
    api.FileReadChunk file_read_chunk = 101;
    api.FileDeleteRequest file_delete = 102;
    AnimationValidate animation_validate = 110;
    AnimationListRequest animation_list_request = 111;
    OdometryGet odometry_get = 130;
    GoalMove goal_move = 131;
    GoalCancel goal_cancel = 132;
    TaskStatsRequest task_stats_request = 140;
    CoreDumpGet core_dump_get = 150;
    CoreDumpRead core_dump_read = 151;
    CoreDumpErase core_dump_erase = 152;
  }
}

message CorrelationResponse {
  // The replies to the requests the snapshots replaced (CorrelationRequest).
  reserved 53, 62, 132;
  reserved "wifi_status", "ap_status", "mode";
  uint32 correlation_id = 1;
  uint32 status_code = 2;
  // Why a request was refused, for the app to show; empty on success.
  string error_message = 3;
  oneof response {
    FeaturesDataResponse features_data_response = 10;
    I2CScanData i2c_scan_data = 20;
    SystemInformationResponse system_information_response = 40;
    api.WifiSettings wifi_settings = 50;
    api.WifiNetworkList wifi_network_list = 52;
    api.APSettings ap_settings = 60;
    api.MDNSStatus mdns_status = 70;
    api.MDNSQueryResponse mdns_query_response = 71;
    api.ServoSettings servo_settings = 80;
    api.PeripheralSettings peripheral_settings = 90;
    api.EmptyMessage empty = 5;
    api.FileChunk file_chunk = 101;
    AnimationReport animation_report = 110;
    AnimationList animation_list = 111;
    OdometryData odometry = 130;
    GoalStatus goal_status = 131;
    TaskStats task_stats = 140;
    CoreDumpReport core_dump_report = 150;
  }
}

// Progress of a firmware update the robot is applying itself (github download or upload).
enum OtaState {
  OTA_IDLE = 0;
  OTA_PROGRESS = 1;
  OTA_FINISHED = 2;
  OTA_ERROR = 3;
}
message OtaStatusData {
  OtaState state = 1;
  uint32 progress = 2;  // percent of the image written, 0-100
  string error = 3;
}

// SYS_NONE=0 is a no-op so an empty frame can't trigger a reboot.
enum SystemCommand {
  SYS_NONE = 0;
  SYS_RESTART = 1;
  SYS_RESET = 2;
  SYS_SLEEP = 3;
}
message SystemCommandData {
  SystemCommand command = 1;
}

// --- Animations (animation.proto holds the file schema) ---

message AnimationParam {
  animation.ParamId id = 1;
  float value = 2;
}
// Loads /littlefs/animations/<name>.pb and plays it. From any active mode the robot borrows ANIMATE
// and hands the mode back when the player finishes; a play while playing chains.
message AnimationPlay {
  string name = 1;
  repeated AnimationParam params = 2;
}
message AnimationStop {}
// Puppeteer target, applied only in ANIMATE while nothing is playing; held if the stream stops.
message PoseData {
  animation.BodyPose body = 1;
  repeated animation.LegTarget legs = 2;  // 0 or 6
}
enum AnimationState {
  ANIM_IDLE = 0;
  ANIM_ENTRY = 1;
  ANIM_PLAYING = 2;
  ANIM_HOLD = 3;
  ANIM_EXIT = 4;
}
// Observable: pushed on every state change and at 5 Hz while the player is not idle.
message AnimationStatus {
  string name = 1;
  AnimationState state = 2;
  float t = 3;
  uint32 clamped_mask = 4;  // bit leg*3+joint for joints pinned at a limit or an unreachable foot
}
message AnimationValidate { string name = 1; }
message AnimationReport {
  bool ok = 1;
  string error = 2;          // first structural error, empty when ok
  uint32 clamped_mask = 3;   // union over every keyframe and 32 intermediate times per segment
}
message AnimationListRequest {}
message AnimationEntry {
  string name = 1;
  uint32 size = 2;
}
message AnimationList { repeated AnimationEntry entries = 1; }

message Message {
  // RSSIData, which nothing ever sent.
  reserved 260;
  reserved "rssi";
  oneof message {
    // A subscribe; the robot echoes it to the client as the ack, after a state topic's current value
    // (platform_shared/topics.json).
    SubscribeNotification sub_notif = 20;
    UnsubscribeNotification unsub_notif = 21;
    PingMsg pingmsg = 30;
    PongMsg pongmsg = 31;
    CorrelationRequest correlation_request = 10;
    CorrelationResponse correlation_response = 11;
    IMUData imu = 110;
    AnalyticsData analytics = 150;
    ModeData mode = 130;
    ControllerInputData input = 140;
    GaitData gait = 160;
    AnglesData angles = 170;
    ServoPWMData servo_pwm = 210;
    ServoStateData servo_state = 211;
    JointAngleData joint_angle = 212;
    SystemCommandData system_command = 120;
    api.WifiStatus wifi_status = 250;  // observable status: pushed on change (connect/disconnect)
    api.APStatus ap_status = 251;      // observable status: pushed on AP up/down/station change
    OtaStatusData ota_status = 270;    // observable status: pushed while a firmware update runs
    AnimationPlay animation_play = 280;
    AnimationStop animation_stop = 281;
    PoseData pose = 282;
    AnimationStatus animation_status = 283;  // observable status: pushed while an animation runs
    TelemetryBatch telemetry_batch = 290;    // stream: every control tick while subscribed
    GoalStatus goal_status = 300;            // observable status: pushed while a goal runs
  }
}
