name: PlatformIO CI

on:
  workflow_call:
    inputs:
      # Only a release keeps the ELF: decoding a core dump needs the exact build's, and at about 20 MB it is
      # not worth uploading on every push.
      elf:
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - "firmware/**"
      - "platform_shared/**"
      - "submodules/**"
      - "platformio.ini"
      - "sdkconfig.defaults"
      - "CMakeLists.txt"
      - ".github/workflows/embedded-build.yml"
  pull_request:
    branches: [main]
    paths:
      - "firmware/**"
      - "platform_shared/**"
      - "submodules/**"
      - "platformio.ini"
      - "sdkconfig.defaults"
      - "CMakeLists.txt"
      - ".github/workflows/embedded-build.yml"

permissions:
  contents: read

jobs:
  native-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: "recursive"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # PlatformIO 6.2 switches to SCons 4.11, which drops SCons.Tool.FortranCommon that the pinned
      # pioarduino platform still imports; 6.1.19 ships SCons 4.8.1 and is what builds locally.
      - name: Install PlatformIO
        run: pip install platformio==6.1.19 protobuf grpcio-tools

      # The native env needs a C++20 host compiler; ubuntu-latest's g++ satisfies it.
      - name: Host tests (kinematics and gait)
        run: pio test -e native

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: "recursive"

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
          key: ${{ runner.os }}-pio-esp32-wroom-camera-${{ hashFiles('platformio.ini') }}
          restore-keys: ${{ runner.os }}-pio-esp32-wroom-camera-

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # pre_build.py regenerates the nanopb sources from platform_shared/*.proto with
      # grpc_tools.protoc. EMBED_WEBAPP=0 by default, so the firmware build needs no Node.
      # pyelftools reads the ELF for the static RAM gate.
      - name: Install PlatformIO and proto dependencies
        run: pip install platformio==6.1.19 protobuf grpcio-tools pyelftools

      - name: Build esp32-wroom-camera
        run: pio run -e esp32-wroom-camera

      # Internal RAM is the robot's binding limit: a change that grows it statically fails here, not at the next boot.
      - name: Static internal RAM within budget
        run: python firmware/scripts/static_ram.py .pio/build/esp32-wroom-camera/firmware.elf

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: firmware-esp32-wroom-camera
          path: .pio/build/esp32-wroom-camera/*.bin
          if-no-files-found: error

      - name: Upload the ELF
        if: inputs.elf
        uses: actions/upload-artifact@v4
        with:
          name: elf-esp32-wroom-camera
          path: .pio/build/esp32-wroom-camera/firmware.elf
          if-no-files-found: error
