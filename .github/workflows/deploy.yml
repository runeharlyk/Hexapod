name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Pull requests run the same checks and build but never deploy, so they get their own group and
# cannot cancel a Pages deployment from main.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.ref) || 'pages' }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./app
    env:
      BASE_PATH: '/${{ github.event.repository.name }}'

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v2
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"
          cache-dependency-path: "./app/pnpm-lock.yaml"

      # `pnpm build` runs `pnpm proto`, which compiles platform_shared/*.proto with
      # grpc_tools.protoc. The runner image's system python is PEP 668 externally managed, so
      # install grpcio-tools into a setup-python interpreter rather than letting the script's
      # pip fallback fail.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install grpcio-tools
        working-directory: .

      - run: pnpm install
      # svelte-check type-checks against the generated ts-proto sources, so generate them first.
      - run: pnpm proto
      - run: pnpm check
      - run: pnpm lint
      - run: pnpm test:unit
      - run: pnpm run build

      - name: Setup Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v4
        with:
          static_site_generator: "sveltekit"

      - name: Upload artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: app/build/

  deploy:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
