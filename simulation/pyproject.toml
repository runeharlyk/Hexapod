[project]
name = "hexapod-sim"
version = "0.1.0"
description = "Hexapod MuJoCo simulation and RL training (sim-to-real)"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "mujoco>=3.2,<3.3",
    "gymnasium>=1.0",
    "stable-baselines3>=2.6",
    "torch==2.4.1",
    "numpy<2",
    "scipy",
    "tensorboard",
    "tqdm",
    "rich",
    "mediapy",
]

[tool.uv]
package = false

# PyTorch CUDA 11.8 wheels come from the dedicated index, not PyPI.
[tool.uv.sources]
torch = { index = "pytorch-cu118" }

[[tool.uv.index]]
name = "pytorch-cu118"
url = "https://download.pytorch.org/whl/cu118"
explicit = true
