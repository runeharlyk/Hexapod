; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
description = Hexapod
data_dir = firmware/data
src_dir = firmware/src
lib_dir = firmware/lib
include_dir = firmware/include
test_dir = firmware/test
extra_configs =
	firmware/factory_settings.ini
	firmware/features.ini
build_cache_dir = firmware/.pio/build_cache
default_envs = esp32-wroom-camera


; ================================================================
; Project environments

; The only board ported to ESP-IDF so far is the ESP32-S3 WROOM cam (the actual robot).
; The classic-ESP32 esp32-camera and esp32dev envs were Arduino-only and are removed
; until re-added against IDF; recover from git history (main branch) when needed.

[env:esp32-wroom-camera]
board = esp32-s3-devkitc-1
board_upload.flash_size = 16MB
board_build.partitions = firmware/partition_table/default_16MB.csv
board_build.sdkconfig_defaults = sdkconfig.defaults
upload_speed = 921600
build_flags =
	${env.build_flags}
	-D USE_CAMERA=1
	-D CAMERA_MODEL_ESP32S3_EYE=1
	-D WS2812_PIN=48
	-D USS_LEFT_PIN=1
	-D USS_RIGHT_PIN=14
	-D SDA_PIN=47
	-D SCL_PIN=21


; Host env for the gait/kinematics tests (`pio test -e native`). GaitController and Kinematics are
; header-only float math, so they run off-device; math_utils.h falls back to a portable matrix
; multiply when ESP-DSP is absent. Needs a C++20 host compiler on PATH -- override with the CXX
; environment variable when the default `g++` is older (MSYS2 ucrt64 works).
[env:native]
platform = native
framework =
test_framework = unity
build_flags =
	-std=gnu++2a
	-Wall
	-I firmware/include
build_unflags =
extra_scripts =


; ================================================================
; General environment section

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.21-2/platform-espressif32.zip
framework = espidf
monitor_speed = 115200
monitor_filters =
	esp32_exception_decoder
	direct
build_flags =
	${factory_settings.build_flags}
	${features.build_flags}
	-std=gnu++2a
	-O2
	-ffunction-sections
	-fdata-sections
	-Wl,--gc-sections
	-Wno-missing-braces
build_unflags = -std=gnu++11
build_src_flags =
	-Wstack-usage=4096

board_build.filesystem = littlefs
extra_scripts =
	pre:firmware/scripts/pre_build.py
	pre:firmware/scripts/build_app.py
