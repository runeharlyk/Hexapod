[features]
build_flags =
  -D EMBED_WEBAPP=0

  ; Hardware specific
  ; Protobuf over the native USB port: lets the https app provision WiFi without BLE pairing.
  -D USE_SERIAL_LINK=1
  -D USE_POLICY=1
  -D USE_MPU6050=1
  -D USE_MAG=1
  ; ESP-NOW handheld controller receiver. The controller broadcasts on a fixed channel, so the
  ; robot's radio must sit on ESPNOW_WIFI_CHANNEL (AP mode without a STA join).
  -D USE_ESPNOW=1
  -D ESPNOW_WIFI_CHANNEL=1
